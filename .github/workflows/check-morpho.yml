# .github/workflows/check-morpho.yml
name: Morpho Vault APY Notifier

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI / API

jobs:
  check-morpho-apy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Run Morpho Check
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        MORPHO_UTILIZATION_THRESHOLD: ${{ vars.MORPHO_UTILIZATION_THRESHOLD }}
        MORPHO_VAULT_ADDRESS: ${{ vars.MORPHO_VAULT_ADDRESS }}
        MORPHO_CHAIN_ID: ${{ vars.MORPHO_CHAIN_ID }}
      run: node check-morpho.js

    - name: Commit & Push Alert State
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add alert-state.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "update Morpho alert state" && git push)
