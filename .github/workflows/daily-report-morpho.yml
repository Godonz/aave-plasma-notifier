# .github/workflows/daily-report-morpho.yml
name: Morpho Daily Status Report

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI / API

jobs:
  daily-report-morpho:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Run Daily Report
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        MORPHO_UTILIZATION_THRESHOLD: ${{ vars.MORPHO_UTILIZATION_THRESHOLD }}
        MORPHO_VAULT_ADDRESS: ${{ vars.MORPHO_VAULT_ADDRESS }}
        MORPHO_CHAIN_ID: ${{ vars.MORPHO_CHAIN_ID }}
        SEND_ALWAYS: 'true' # Force notification regardless of threshold
      run: node check-morpho.js

    - name: Commit & Push Daily History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history-morpho.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "update Morpho daily history" && git push)
